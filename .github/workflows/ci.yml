name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 e não 20: o banco de contas usa `node:sqlite`, que só existe a partir
          # do 22.5 — é a mesma versão que a imagem de produção roda.
          node-version: "22"

      - name: Testes do servidor Node
        run: npm test
